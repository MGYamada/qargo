name: Standard Qleisli bundle and qargo boundaries

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  rust:
    name: ${{ matrix.os }} / Rust ${{ matrix.toolchain }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        os: ["ubuntu-latest", "macos-latest"]
        toolchain: ["1.85.0", "stable"]
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - name: Prepare development toolchain
        run: rustup toolchain install ${{ matrix.toolchain }} --profile minimal --component clippy --component rustfmt
      - name: Prepare development dependencies
        run: cargo +${{ matrix.toolchain }} fetch --locked
      - name: Bind the actual registry dependency source
        shell: bash
        run: |
          cargo +${{ matrix.toolchain }} metadata --frozen --format-version=1 --manifest-path=Cargo.toml > "$RUNNER_TEMP/qargo-dependencies.json"
          qleisli_source_root="$(python3 scripts/qleisli_dependency.py --metadata="$RUNNER_TEMP/qargo-dependencies.json" --manifest-path=Cargo.toml)"
          printf 'QLEISLI_SOURCE_ROOT=%s\n' "$qleisli_source_root" >> "$GITHUB_ENV"
      - name: Copy the bound Lean setup metadata outside captured sources
        shell: bash
        run: |
          mkdir "$RUNNER_TEMP/qargo-lean-setup"
          cp "$QLEISLI_SOURCE_ROOT/lean-kernel/lean-toolchain" "$QLEISLI_SOURCE_ROOT/lean-kernel/lakefile.toml" "$QLEISLI_SOURCE_ROOT/lean-kernel/lake-manifest.json" "$RUNNER_TEMP/qargo-lean-setup/"
      - name: Prepare the actual dependency's pinned Lean toolchain
        uses: leanprover/lean-action@50fcf42d2e460296f1a34b402e990d1b24f8b596
        with:
          lake-package-directory: ${{ runner.temp }}/qargo-lean-setup
          auto-config: 'false'
          build: 'false'
          test: 'false'
          lint: 'false'
          use-github-cache: 'false'
          use-mathlib-cache: 'false'
      - name: Build and audit the explicitly associated native checker
        shell: bash
        run: |
          python3 "$QLEISLI_SOURCE_ROOT/scripts/package_lean_kernel.py" --validation full --output "$RUNNER_TEMP/qargo-native-kernel"
          printf 'QLEISLI_KERNEL=%s\n' "$RUNNER_TEMP/qargo-native-kernel/bin/qleisli-kernel" >> "$GITHUB_ENV"
      - name: Check formatting
        if: matrix.toolchain == 'stable'
        run: cargo +${{ matrix.toolchain }} fmt --all --check
      - name: Test Cargo-free installation boundaries
        run: |
          python3 scripts/test_install.py
          python3 scripts/test_distribution.py
          python3 scripts/test_qleisli_dependency.py
          python3 scripts/test_verify_release.py
          python3 scripts/test_qrate_project.py
          python3 scripts/qrate_project.py
      - name: Test all three engines and integration boundaries
        run: cargo +${{ matrix.toolchain }} test --frozen --workspace --all-targets
      - name: Test Rust API examples
        run: cargo +${{ matrix.toolchain }} test --frozen --workspace --doc
      - name: Check Rust diagnostics
        run: cargo +${{ matrix.toolchain }} clippy --frozen --workspace --all-targets -- -D warnings
      - name: Build Rust API documentation
        env:
          RUSTDOCFLAGS: -D warnings
        run: cargo +${{ matrix.toolchain }} doc --frozen --workspace --no-deps
      - name: Build four executables and verify the source archive
        shell: bash
        run: |
          release_source_dir="$RUNNER_TEMP/qargo-source"
          mkdir -p "$release_source_dir"
          git archive --format=tar HEAD | tar -x -C "$release_source_dir"
          cargo +${{ matrix.toolchain }} fetch --locked --manifest-path="$release_source_dir/Cargo.toml"
          cargo +${{ matrix.toolchain }} build --release --frozen --bins --manifest-path="$release_source_dir/Cargo.toml"
          cargo +${{ matrix.toolchain }} metadata --frozen --format-version=1 --manifest-path="$release_source_dir/Cargo.toml" > "$RUNNER_TEMP/archive-dependencies.json"
          python3 scripts/qleisli_dependency.py --metadata="$RUNNER_TEMP/archive-dependencies.json" --manifest-path="$release_source_dir/Cargo.toml" --require-source-root="$QLEISLI_SOURCE_ROOT"
          python3 "$release_source_dir/scripts/verify_release.py" --source-root="$release_source_dir" --bin-dir="$release_source_dir/target/release" --qleisli-source-root="$QLEISLI_SOURCE_ROOT"
      - name: Verify crates.io packaging and installation
        shell: bash
        run: |
          release_source_dir="$RUNNER_TEMP/qargo-source"
          package_install_dir="$RUNNER_TEMP/qargo-install"
          package_extract_dir="$RUNNER_TEMP/qargo-package"
          cargo +${{ matrix.toolchain }} package --locked -p qargo --manifest-path="$release_source_dir/Cargo.toml"
          mkdir -p "$package_extract_dir"
          tar -xzf "$release_source_dir/target/package/qargo-0.1.9.crate" -C "$package_extract_dir"
          cargo +${{ matrix.toolchain }} install --locked --path "$package_extract_dir/qargo-0.1.9" --bins --root "$package_install_dir"
          cargo +${{ matrix.toolchain }} metadata --frozen --format-version=1 --manifest-path="$package_extract_dir/qargo-0.1.9/Cargo.toml" > "$RUNNER_TEMP/package-dependencies.json"
          python3 scripts/qleisli_dependency.py --metadata="$RUNNER_TEMP/package-dependencies.json" --manifest-path="$package_extract_dir/qargo-0.1.9/Cargo.toml" --require-source-root="$QLEISLI_SOURCE_ROOT"
          python3 "$release_source_dir/scripts/verify_package.py" --source-root="$release_source_dir" --crate="$release_source_dir/target/package/qargo-0.1.9.crate" --bin-dir="$package_install_dir/bin" --qleisli-source-root="$QLEISLI_SOURCE_ROOT"
      - name: Retain actual dependency associations and native preparation
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        if: always()
        with:
          name: linked-inputs-${{ matrix.os }}-${{ matrix.toolchain }}
          path: |
            ${{ runner.temp }}/*-dependencies.json
            ${{ runner.temp }}/qargo-native-kernel/manifest.json
          if-no-files-found: error
