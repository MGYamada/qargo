name: Standard Qleisli bundle and Qargo boundaries

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  rust:
    name: ${{ matrix.os }} / Rust ${{ matrix.toolchain }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        os: ["ubuntu-latest", "macos-latest"]
        toolchain: ["1.85.0", "stable"]
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - name: Prepare development toolchain
        run: rustup toolchain install ${{ matrix.toolchain }} --profile minimal --component clippy --component rustfmt
      - name: Prepare development dependencies
        run: cargo +${{ matrix.toolchain }} fetch --locked
      - name: Check formatting
        if: matrix.toolchain == 'stable'
        run: cargo +${{ matrix.toolchain }} fmt --all --check
      - name: Test Cargo-free installation boundaries
        run: |
          python3 scripts/test_install.py
          python3 scripts/test_distribution.py
          python3 scripts/test_qrate_project.py
          python3 scripts/qrate_project.py
      - name: Test all three engines and integration boundaries
        run: cargo +${{ matrix.toolchain }} test --frozen --workspace --all-targets
      - name: Test Rust API examples
        run: cargo +${{ matrix.toolchain }} test --frozen --workspace --doc
      - name: Check Rust diagnostics
        run: cargo +${{ matrix.toolchain }} clippy --frozen --workspace --all-targets -- -D warnings
      - name: Build Rust API documentation
        env:
          RUSTDOCFLAGS: -D warnings
        run: cargo +${{ matrix.toolchain }} doc --frozen --workspace --no-deps
      - name: Build four executables and verify the source archive
        shell: bash
        run: |
          release_source_dir="$RUNNER_TEMP/qargo-source"
          mkdir -p "$release_source_dir"
          git archive --format=tar HEAD | tar -x -C "$release_source_dir"
          cargo +${{ matrix.toolchain }} fetch --locked --manifest-path="$release_source_dir/Cargo.toml"
          cargo +${{ matrix.toolchain }} build --release --frozen --bins --manifest-path="$release_source_dir/Cargo.toml"
          python3 "$release_source_dir/scripts/verify_release.py" --source-root="$release_source_dir" --bin-dir="$release_source_dir/target/release"
      - name: Verify crates.io packaging and installation
        shell: bash
        run: |
          release_source_dir="$RUNNER_TEMP/qargo-source"
          package_install_dir="$RUNNER_TEMP/qargo-install"
          package_extract_dir="$RUNNER_TEMP/qargo-package"
          cargo +${{ matrix.toolchain }} package --locked -p qargo --manifest-path="$release_source_dir/Cargo.toml"
          mkdir -p "$package_extract_dir"
          tar -xzf "$release_source_dir/target/package/qargo-0.1.7.crate" -C "$package_extract_dir"
          cargo +${{ matrix.toolchain }} install --locked --path "$package_extract_dir/qargo-0.1.7" --bins --root "$package_install_dir"
          python3 "$release_source_dir/scripts/verify_package.py" --source-root="$release_source_dir" --crate="$release_source_dir/target/package/qargo-0.1.7.crate" --bin-dir="$package_install_dir/bin"

  independent-qrate:
    # The push run verifies the exact candidate for same-repository PRs.
    # Fork PRs still require their own extraction run.
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name != github.repository
    name: Extracted ${{ matrix.component }} / ${{ matrix.os }} / Rust ${{ matrix.toolchain }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        component: ["qlippy", "qlifmt", "qlidoc"]
        os: ["ubuntu-latest", "macos-latest"]
        toolchain: ["1.85.0", "stable"]
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - name: Prepare explicit development dependencies and tools
        shell: bash
        run: |
          python3 -c 'import sys; assert sys.version_info >= (3, 11)'
          rustup toolchain install '${{ matrix.toolchain }}' --profile minimal --component clippy --component rustfmt
          if [[ '${{ runner.os }}' == 'Linux' ]]; then
            sudo apt-get update
            sudo apt-get install --yes strace
          fi
          cargo +${{ matrix.toolchain }} fetch --locked
          cargo +${{ matrix.toolchain }} fetch --locked --manifest-path 'rust/${{ matrix.component }}/Cargo.toml'
          cargo +${{ matrix.toolchain }} build --frozen --bins
          mkdir -p "$RUNNER_TEMP/bundle/bin"
          cp target/debug/qargo target/debug/qlippy target/debug/qlifmt target/debug/qlidoc "$RUNNER_TEMP/bundle/bin/"
          python3 scripts/qrate_project.py --component '${{ matrix.component }}' --destination "$RUNNER_TEMP/extracted" --cargo "$(rustup which --toolchain '${{ matrix.toolchain }}' cargo)"
          rustc +${{ matrix.toolchain }} --print sysroot > "$RUNNER_TEMP/verification-toolchain"
      - name: Verify without access to the original repository
        shell: bash
        working-directory: ${{ runner.temp }}
        run: |
          mv "$GITHUB_WORKSPACE" "$RUNNER_TEMP/original-checkout"
          chmod 000 "$RUNNER_TEMP/original-checkout"
          trap 'chmod 755 "$RUNNER_TEMP/original-checkout"; mv "$RUNNER_TEMP/original-checkout" "$GITHUB_WORKSPACE"' EXIT
          python3 "$RUNNER_TEMP/extracted/scripts/verify_qrate.py" \
            --project "$RUNNER_TEMP/extracted" \
            --toolchain "$(cat "$RUNNER_TEMP/verification-toolchain")" \
            --bundle-bin "$RUNNER_TEMP/bundle/bin" \
            --output "$RUNNER_TEMP/verification"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        if: always()
        with:
          name: extraction-${{ matrix.component }}-${{ matrix.os }}-${{ matrix.toolchain }}
          path: |
            ${{ runner.temp }}/extracted/project-record.json
            ${{ runner.temp }}/verification/native-inputs.json
            ${{ runner.temp }}/verification/build-record.json
            ${{ runner.temp }}/verification/work/build-access-*.log
          if-no-files-found: error
