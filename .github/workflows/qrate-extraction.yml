name: Verify independent qrate extraction

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  independent-qrate:
    name: Extracted ${{ matrix.component }} / ${{ matrix.os }} / Rust ${{ matrix.toolchain }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        component: ["qlippy", "qlifmt", "qlidoc"]
        os: ["ubuntu-latest", "macos-latest"]
        toolchain: ["1.85.0", "stable"]
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - name: Prepare explicit development dependencies and tools
        shell: bash
        run: |
          python3 -c 'import sys; assert sys.version_info >= (3, 11)'
          rustup toolchain install '${{ matrix.toolchain }}' --profile minimal --component clippy --component rustfmt
          if [[ '${{ runner.os }}' == 'Linux' ]]; then
            sudo apt-get update
            sudo apt-get install --yes strace
          fi
          cargo +${{ matrix.toolchain }} fetch --locked
          cargo +${{ matrix.toolchain }} fetch --locked --manifest-path 'rust/${{ matrix.component }}/Cargo.toml'
          cargo +${{ matrix.toolchain }} build --frozen --bins
          mkdir -p "$RUNNER_TEMP/bundle/bin"
          cp target/debug/qargo target/debug/qlippy target/debug/qlifmt target/debug/qlidoc "$RUNNER_TEMP/bundle/bin/"
          python3 scripts/qrate_project.py --component '${{ matrix.component }}' --destination "$RUNNER_TEMP/extracted" --cargo "$(rustup which --toolchain '${{ matrix.toolchain }}' cargo)"
          rustc +${{ matrix.toolchain }} --print sysroot > "$RUNNER_TEMP/verification-toolchain"
      - name: Verify without access to the original repository
        shell: bash
        working-directory: ${{ runner.temp }}
        run: |
          mv "$GITHUB_WORKSPACE" "$RUNNER_TEMP/original-checkout"
          chmod 000 "$RUNNER_TEMP/original-checkout"
          trap 'chmod 755 "$RUNNER_TEMP/original-checkout"; mv "$RUNNER_TEMP/original-checkout" "$GITHUB_WORKSPACE"' EXIT
          python3 "$RUNNER_TEMP/extracted/scripts/verify_qrate.py" \
            --project "$RUNNER_TEMP/extracted" \
            --toolchain "$(cat "$RUNNER_TEMP/verification-toolchain")" \
            --bundle-bin "$RUNNER_TEMP/bundle/bin" \
            --output "$RUNNER_TEMP/verification"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        if: always()
        with:
          name: extraction-${{ matrix.component }}-${{ matrix.os }}-${{ matrix.toolchain }}
          path: |
            ${{ runner.temp }}/extracted/project-record.json
            ${{ runner.temp }}/verification/native-inputs.json
            ${{ runner.temp }}/verification/build-record.json
            ${{ runner.temp }}/verification/work/build-access-*.log
          if-no-files-found: error
