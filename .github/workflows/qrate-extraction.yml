name: Verify independent qrate extraction

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  independent-qrate:
    name: Extracted ${{ matrix.component }} / ${{ matrix.os }} / Rust ${{ matrix.toolchain }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        component: ["qlinty", "qlifmt", "qlidoc"]
        os: ["ubuntu-latest", "macos-latest"]
        toolchain: ["1.85.0", "stable"]
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - name: Prepare explicit development dependencies and tools
        shell: bash
        run: |
          python3 -c 'import sys; assert sys.version_info >= (3, 11)'
          rustup toolchain install '${{ matrix.toolchain }}' --profile minimal --component clippy --component rustfmt
          if [[ '${{ runner.os }}' == 'Linux' ]]; then
            sudo apt-get update
            sudo apt-get install --yes strace
          fi
          cargo +${{ matrix.toolchain }} fetch --locked
          cargo +${{ matrix.toolchain }} fetch --locked --manifest-path 'rust/${{ matrix.component }}/Cargo.toml'
          cargo +${{ matrix.toolchain }} metadata --frozen --format-version=1 --manifest-path=Cargo.toml > "$RUNNER_TEMP/bundle-dependencies.json"
          qleisli_bundle_source_root="$(python3 scripts/qleisli_dependency.py --metadata="$RUNNER_TEMP/bundle-dependencies.json" --manifest-path=Cargo.toml)"
          printf 'QLEISLI_BUNDLE_SOURCE_ROOT=%s\n' "$qleisli_bundle_source_root" >> "$GITHUB_ENV"
          cargo +${{ matrix.toolchain }} build --frozen --bins
          mkdir -p "$RUNNER_TEMP/bundle/bin"
          cp target/debug/qlirgo target/debug/qlinty target/debug/qlifmt target/debug/qlidoc "$RUNNER_TEMP/bundle/bin/"
          python3 scripts/qrate_project.py --component '${{ matrix.component }}' --destination "$RUNNER_TEMP/extracted" --cargo "$(rustup which --toolchain '${{ matrix.toolchain }}' cargo)"
          component_dir="$RUNNER_TEMP/extracted/rust/${{ matrix.component }}"
          (cd "$component_dir"; cargo +${{ matrix.toolchain }} metadata --frozen --format-version=1 > "$RUNNER_TEMP/component-dependencies.json")
          qleisli_source_root="$(python3 scripts/qleisli_dependency.py --metadata="$RUNNER_TEMP/component-dependencies.json" --manifest-path="$component_dir/Cargo.toml" --same-package-source-root="$qleisli_bundle_source_root" --same-package-manifest-path=Cargo.toml)"
          printf 'QLEISLI_SOURCE_ROOT=%s\n' "$qleisli_source_root" >> "$GITHUB_ENV"
          rustc +${{ matrix.toolchain }} --print sysroot > "$RUNNER_TEMP/verification-toolchain"
      - name: Copy the bound Lean setup metadata outside captured sources
        shell: bash
        run: |
          mkdir "$RUNNER_TEMP/qlirgo-lean-setup"
          cp "$QLEISLI_SOURCE_ROOT/lean-kernel/lean-toolchain" "$QLEISLI_SOURCE_ROOT/lean-kernel/lakefile.toml" "$QLEISLI_SOURCE_ROOT/lean-kernel/lake-manifest.json" "$RUNNER_TEMP/qlirgo-lean-setup/"
      - name: Prepare the actual dependency's pinned Lean toolchain
        uses: leanprover/lean-action@50fcf42d2e460296f1a34b402e990d1b24f8b596
        with:
          lake-package-directory: ${{ runner.temp }}/qlirgo-lean-setup
          auto-config: 'false'
          build: 'false'
          test: 'false'
          lint: 'false'
          use-github-cache: 'false'
          use-mathlib-cache: 'false'
      - name: Build and audit the explicitly associated native checker
        shell: bash
        run: |
          python3 "$QLEISLI_SOURCE_ROOT/scripts/package_lean_kernel.py" --validation full --output "$RUNNER_TEMP/qlirgo-native-kernel"
          printf 'QLEISLI_KERNEL=%s\n' "$RUNNER_TEMP/qlirgo-native-kernel/bin/qleisli-kernel" >> "$GITHUB_ENV"
      - name: Verify without access to the original repository
        shell: bash
        working-directory: ${{ runner.temp }}
        run: |
          mv "$GITHUB_WORKSPACE" "$RUNNER_TEMP/original-checkout"
          chmod 000 "$RUNNER_TEMP/original-checkout"
          trap 'chmod 755 "$RUNNER_TEMP/original-checkout"; mv "$RUNNER_TEMP/original-checkout" "$GITHUB_WORKSPACE"' EXIT
          python3 "$RUNNER_TEMP/extracted/scripts/verify_qrate.py" \
            --project "$RUNNER_TEMP/extracted" \
            --toolchain "$(cat "$RUNNER_TEMP/verification-toolchain")" \
            --bundle-bin "$RUNNER_TEMP/bundle/bin" \
            --qleisli-kernel "$QLEISLI_KERNEL" \
            --output "$RUNNER_TEMP/verification"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        if: always()
        with:
          name: extraction-${{ matrix.component }}-${{ matrix.os }}-${{ matrix.toolchain }}
          path: |
            ${{ runner.temp }}/extracted/project-record.json
            ${{ runner.temp }}/verification/native-inputs.json
            ${{ runner.temp }}/bundle-dependencies.json
            ${{ runner.temp }}/component-dependencies.json
            ${{ runner.temp }}/qlirgo-native-kernel/manifest.json
            ${{ runner.temp }}/verification/build-record.json
            ${{ runner.temp }}/verification/work/build-access-*.log
          if-no-files-found: error
