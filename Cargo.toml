[package]
name = "qargo-tools"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
license = "Apache-2.0"
repository = "https://github.com/MGYamada/qargo"
description = "Local Qleisli qrate orchestration and an independent lint engine"
publish = false

[workspace]
members = ["rust/qlippy"]
default-members = [".", "rust/qlippy"]
resolver = "3"

[workspace.dependencies]
qleisli = "=0.2.1"
serde = { version = "=1.0.228", features = ["derive"] }
serde_json = "=1.0.145"
sha2 = "=0.10.9"
tempfile = "=3.23.0"
toml = "=0.8.23"
libc = "=0.2.177"

[dependencies]
qlippy-engine = { path = "rust/qlippy" }
qleisli = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tempfile = { workspace = true }
toml = { workspace = true }

[target.'cfg(unix)'.dependencies]
rustix = { version = "=1.1.3", features = ["fs"] }

[[bin]]
name = "qargo"
path = "src/bin/qargo.rs"

[[bin]]
name = "qlippy"
path = "qrates/qlippy/src/bin/qlippy.rs"

[[test]]
name = "qlippy"
path = "qrates/qlippy/tests/engine.rs"

[[test]]
name = "snapshot"
path = "qrates/qlippy/tests/snapshot.rs"

[lints.rust]
unsafe_code = "forbid"
