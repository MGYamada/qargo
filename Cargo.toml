[package]
name = "qargo"
version = "0.1.2"
edition = "2024"
rust-version = "1.85"
license = "Apache-2.0"
repository = "https://github.com/MGYamada/qargo"
description = "Local Qleisli qrate orchestration with standard lint, format, and documentation tools"
publish = ["crates-io"]
readme = "README.md"
keywords = ["qleisli", "qrate", "lint", "format", "documentation"]
categories = ["command-line-utilities", "development-tools"]
include = ["/src/**", "/qrates/*/Qargo.toml", "/qrates/*/src/**", "/qrates/*/tests/**", "/qrates/*/docs/**", "/tests/**", "/docs/**", "/scripts/*.py", "/README.md", "/CHANGELOG.md", "/LICENSE", "/NOTICE", "/AGENTS.md", "!**/.DS_Store", "!**/__pycache__/**"]

[lib]
name = "qargo_tools"

[workspace]
members = ["rust/qlippy", "rust/qlifmt", "rust/qlidoc"]
default-members = [".", "rust/qlippy", "rust/qlifmt", "rust/qlidoc"]
resolver = "3"

[workspace.dependencies]
qleisli = "=0.2.1"
serde = { version = "=1.0.228", features = ["derive"] }
serde_json = "=1.0.145"
sha2 = "=0.10.9"
tempfile = "=3.23.0"
toml = "=0.8.23"
libc = "=0.2.177"

[dependencies]
qleisli = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
sha2 = { workspace = true }
tempfile = { workspace = true }
toml = { workspace = true }

[target.'cfg(unix)'.dependencies]
rustix = { version = "=1.1.3", features = ["fs"] }
libc = { workspace = true }

[[bin]]
name = "qargo"
path = "src/bin/qargo.rs"

[[bin]]
name = "qlippy"
path = "qrates/qlippy/src/bin/qlippy.rs"

[[test]]
name = "qlippy"
path = "qrates/qlippy/tests/engine.rs"

[[bin]]
name = "qlifmt"
path = "qrates/qlifmt/src/bin/qlifmt.rs"

[[bin]]
name = "qlidoc"
path = "qrates/qlidoc/src/bin/qlidoc.rs"

[[test]]
name = "qlifmt"
path = "qrates/qlifmt/tests/engine.rs"

[[test]]
name = "qlidoc"
path = "qrates/qlidoc/tests/engine.rs"

[[test]]
name = "snapshot"
path = "qrates/qlippy/tests/snapshot.rs"

[lints.rust]
unsafe_code = "forbid"
