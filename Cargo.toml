[package]
name = "qlirgo"
version = "0.2.0-beta"
edition = "2024"
rust-version = "1.85"
license = "Apache-2.0"
repository = "https://github.com/MGYamada/qlirgo"
documentation = "https://docs.rs/qlirgo/0.2.0-beta"
description = "Local Qleisli qrate orchestration with standard lint, format, and documentation tools"
publish = ["crates-io"]
readme = "README.md"
keywords = ["qleisli", "qrate", "lint", "format", "documentation"]
categories = ["command-line-utilities", "development-tools"]
include = ["/src/**", "/qrates/*/Qlirgo.toml", "/qrates/*/Qargo.toml", "/qrates/*/src/**", "/qrates/*/tests/**", "/qrates/*/docs/**", "/tests/**", "/docs/**", "/scripts/*.py", "/install.sh", "/README.md", "/CHANGELOG.md", "/LICENSE", "/NOTICE", "/AGENTS.md", "/QRATEBOUNDARY.md", "!**/.DS_Store", "!**/__pycache__/**"]

[lib]
name = "qlirgo_tools"

[workspace]
members = ["."]
exclude = ["rust/qlinty", "rust/qlifmt", "rust/qlidoc"]
resolver = "3"

[workspace.dependencies]
qleisli = "=0.3.0-beta"
serde = { version = "=1.0.228", features = ["derive"] }
serde_json = "=1.0.145"
sha2 = "=0.10.9"
tempfile = "=3.23.0"
toml = "=0.8.23"
libc = "=0.2.177"
libproc = "=0.14.11"

[dependencies]
qleisli = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
sha2 = { workspace = true }
tempfile = { workspace = true }
toml = { workspace = true }

[target.'cfg(unix)'.dependencies]
rustix = { version = "=1.1.3", features = ["fs", "process"] }
libc = { workspace = true }

[target.'cfg(target_os = "macos")'.dependencies]
libproc = { workspace = true }

[[bin]]
name = "qlirgo"
path = "src/bin/qlirgo.rs"

[[bin]]
name = "qlinty"
path = "src/bin/qlinty.rs"

[[test]]
name = "qlinty"
path = "tests/qlinty.rs"

[[bin]]
name = "qlifmt"
path = "src/bin/qlifmt.rs"

[[bin]]
name = "qlidoc"
path = "src/bin/qlidoc.rs"

[[test]]
name = "qlifmt"
path = "tests/qlifmt.rs"

[[test]]
name = "qlidoc"
path = "tests/qlidoc.rs"

[[test]]
name = "snapshot"
path = "tests/snapshot.rs"

[lints.rust]
unsafe_code = "forbid"
