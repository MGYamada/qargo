# Developer-only Rust build configuration. Qargo never reads or executes this.
[package]
name = "qlidoc-engine"
version = "0.1.5"
edition = "2024"
rust-version = "1.85"
license = "Apache-2.0"
publish = false
description = "Syntax-only Qleisli Markdown documentation engine"

[lib]
path = "../../qrates/qlidoc/src/lib.rs"

[dependencies]
qlippy-engine = { path = "../qlippy" }
qleisli = { workspace = true }
serde_json = { workspace = true }
sha2 = { workspace = true }
tempfile = { workspace = true }

[lints.rust]
unsafe_code = "forbid"
