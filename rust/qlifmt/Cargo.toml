# Developer-only Rust configuration. Qargo never reads or executes this.
[package]
name = "qlifmt-engine"
version = "0.1.1"
edition = "2024"
rust-version = "1.85"
license = "Apache-2.0"
publish = false
description = "Token-preserving Qleisli formatter whose sources belong to the qlifmt qrate"

[lib]
path = "../../qrates/qlifmt/src/lib.rs"

[dependencies]
qlippy-engine = { path = "../qlippy" }
qleisli = { workspace = true }
serde_json = { workspace = true }

[target.'cfg(unix)'.dependencies]
rustix = { version = "=1.1.3", features = ["fs"] }

[dev-dependencies]
tempfile = { workspace = true }

[lints.rust]
unsafe_code = "forbid"
