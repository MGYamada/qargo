# Developer-only Rust configuration. Qargo never reads or executes this.
[package]
name = "qlifmt-engine"
version = "0.1.8"
edition = "2024"
rust-version = "1.85"
license = "Apache-2.0"
publish = false
description = "Token-preserving Qleisli formatter whose sources belong to the qlifmt qrate"

[lib]
path = "../../qrates/qlifmt/src/lib.rs"

[dependencies]
qlippy-engine = { version = "=0.1.8", path = "../qlippy" }
qleisli = "=0.2.1"
serde_json = "=1.0.145"

[target.'cfg(unix)'.dependencies]
rustix = { version = "=1.1.3", features = ["fs"] }

[dev-dependencies]
tempfile = "=3.23.0"

[lints.rust]
unsafe_code = "forbid"

[workspace]
resolver = "3"

[[bin]]
name = "qlifmt"
path = "../../qrates/qlifmt/src/bin/qlifmt.rs"

[[test]]
name = "engine"
path = "../../qrates/qlifmt/tests/engine.rs"
