# Developer-only Rust build configuration. Qargo never reads or executes this.
[package]
name = "qlippy-engine"
version = "0.1.8"
edition = "2024"
rust-version = "1.85"
license = "Apache-2.0"
publish = false
description = "Pure Rust lint engine whose sources belong to the qlippy qrate"

[lib]
path = "../../qrates/qlippy/src/lib.rs"

[dependencies]
qleisli = "=0.2.1"
serde = { version = "=1.0.228", features = ["derive"] }
serde_json = "=1.0.145"
sha2 = "=0.10.9"
tempfile = "=3.23.0"

[target.'cfg(unix)'.dependencies]
libc = "=0.2.177"
rustix = { version = "=1.1.3", features = ["fs"] }

[target.'cfg(target_os = "macos")'.dependencies]
libproc = "=0.14.11"

[lints.rust]
unsafe_code = "forbid"

[workspace]
resolver = "3"

[[bin]]
name = "qlippy"
path = "../../qrates/qlippy/src/bin/qlippy.rs"

[[test]]
name = "engine"
path = "../../qrates/qlippy/tests/engine.rs"

[[test]]
name = "snapshot"
path = "../../qrates/qlippy/tests/snapshot.rs"
